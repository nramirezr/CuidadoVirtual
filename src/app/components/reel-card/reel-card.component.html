<div class="media">
  <img
    *ngIf="video.fuente === 'youtube' && mostrarMiniatura()"
    class="yt-thumb"
    [src]="miniaturaYoutube"
    alt=""
    decoding="async"
  />
  <video
    *ngIf="video.fuente === 'mp4'"
    #videoEl
    class="mp4-video"
    [attr.src]="estaCerca() ? video.mp4Url : null"
    [poster]="video.posterUrl"
    loop
    playsinline
    [muted]="audioState.muted()"
  ></video>
</div>

<button
  *ngIf="mostrarBotonPlay()"
  type="button"
  class="play-fallback-button"
  (click)="onTapPlay()"
  aria-label="Reproducir video"
>
  ▶
</button>

<div class="overlay-top">
  <span class="category-chip">{{ video.categoria }}</span>
</div>

<div class="overlay-bottom">
  <h3 class="video-title">{{ video.titulo }}</h3>
  <p class="video-description">{{ video.descripcion }}</p>
</div>

<button
  type="button"
  class="mute-button"
  (click)="onToggleMute()"
  [attr.aria-label]="audioState.muted() ? 'Activar sonido' : 'Silenciar'"
>
  {{ audioState.muted() ? '🔇' : '🔊' }}
</button>
