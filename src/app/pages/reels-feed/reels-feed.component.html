<div class="chip-bar">
  <mat-chip-listbox aria-label="Filtrar por categoría">
    <mat-chip-option
      [selected]="categoriaSeleccionada() === null"
      (click)="seleccionarCategoria(null)"
    >
      Todos
    </mat-chip-option>
    <mat-chip-option
      *ngFor="let c of categoriasConVideo()"
      [selected]="categoriaSeleccionada() === c.nombre"
      (click)="seleccionarCategoria(c.nombre)"
    >
      {{ c.icono }} {{ c.nombre }}
    </mat-chip-option>
  </mat-chip-listbox>
</div>

<div class="reels-scroll-container" #scrollContainer>
  <app-reel-card
    *ngFor="let v of videosFiltrados(); trackBy: trackByVideoId"
    [video]="v"
  ></app-reel-card>
</div>
