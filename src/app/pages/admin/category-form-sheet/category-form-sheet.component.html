<form [formGroup]="form" class="sheet-form" (ngSubmit)="guardar()">
  <h2>{{ esEdicion ? 'Editar categoría' : 'Nueva categoría' }}</h2>

  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="nombre" required maxlength="60" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Ícono (emoji)</mat-label>
    <input matInput formControlName="icono" required maxlength="8" />
  </mat-form-field>

  <p class="url-preview">URL resultante: <code>{{ urlPreview }}</code></p>

  <mat-slide-toggle formControlName="activa" class="visibilidad-toggle">
    Visible en el sitio público
  </mat-slide-toggle>

  @if (errorMsg(); as msg) {
    <p class="error-msg">{{ msg }}</p>
  }

  <div class="sheet-actions">
    <button type="button" mat-button class="cv-tap-target" (click)="cancelar()" [disabled]="guardando()">
      Cancelar
    </button>
    <button type="submit" mat-raised-button color="primary" class="cv-tap-target" [disabled]="guardando()">
      {{ guardando() ? 'Guardando…' : 'Guardar' }}
    </button>
  </div>
</form>
