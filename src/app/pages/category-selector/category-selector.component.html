<div class="category-screen">
  <header class="top-bar">
    <a routerLink="/" class="back-link cv-tap-target" aria-label="Volver al inicio">←</a>
    <span class="screen-title">¿Qué te gustaría ver?</span>
  </header>

  @if (cargando()) {
    <p class="status-msg">Cargando categorías…</p>
  } @else if (error()) {
    <p class="status-msg">No pudimos cargar las categorías. Intenta de nuevo más tarde.</p>
  } @else {
    <mat-nav-list class="category-list">
      <a mat-list-item routerLink="/videos" class="category-item todos-item">
        <span class="item-row">
          <span class="category-icon">🎬</span>
          <span class="category-title">Ver todos</span>
        </span>
      </a>
      @for (c of categorias(); track c.id) {
        <a mat-list-item [routerLink]="['/videos', slugFor(c)]" class="category-item">
          <span class="item-row">
            <span class="category-icon">{{ c.icono }}</span>
            <span class="category-title">{{ c.nombre }}</span>
          </span>
        </a>
      }
    </mat-nav-list>
  }
</div>
